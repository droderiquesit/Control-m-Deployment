# ---------------------------------------------------------------------------
# PROD platform: Enterprise Manager HA pair managing two Control-M/Servers,
# CTM_UAT and CTM_PROD. UAT runs on production infrastructure (same EM,
# same database host) so what is accepted is what goes live.
# Zone-redundant everything, 35-day geo backups, Site Recovery + DB replica
# in the paired region, resource locks and purge protection.
# Network placement v2: the EM + shared services live in the utility VNet;
# every Control-M/Server runs in its OWN VNet with its agents beside it, and
# DR mirrors the layout for the DR-protected servers only (DR utility VNet +
# one DR VNet per server opted into dr.server_networks; PoC: prod only).
# Single source of truth: ctmdeploy reads this file and feeds Bicep its params.
# ---------------------------------------------------------------------------
subscription_id: "00000000-0000-0000-0000-000000000000"
environment: prod
location: eastus2
unique_suffix: p01
resource_lock: true

tags:
  costCenter: scheduling
  owner: platform-team
  criticality: tier-1

# Existing networks (select, not create). All VNets pre-exist and must be
# peered per docs/NETWORK-REQUIREMENTS.md (each server VNet <-> utility VNet).
network:
  utility: # EM VMs + internal LB frontend, delegated postgres subnet, private endpoints
    vnet_name: vnet-prod-utility
    vnet_resource_group_name: rg-network-prod
    em_subnet_name: snet-ctm-em
    data_subnet_name: snet-ctm-postgres
    pe_subnet_name: snet-ctm-pe
  # Hub-managed zones (recommended in prod):
  # existing_private_dns_zone_ids:
  #   blob: "/subscriptions/.../privateDnsZones/privatelink.blob.core.windows.net"
  #   file: "/subscriptions/.../privateDnsZones/privatelink.file.core.windows.net"
  #   vault: "/subscriptions/.../privateDnsZones/privatelink.vaultcore.azure.net"
  existing_private_dns_zone_ids: {}
  # Extra VNets to link into the platform/privatelink DNS zones (e.g. a jump VNet):
  # extra_dns_vnets: [{vnet_name: ..., vnet_resource_group_name: ...}]
  extra_dns_vnets: []

# Optional full network ("Option A" in docs/NETWORK-REQUIREMENTS.md): every
# VNet the placement blocks above (and dr: below) reference, provisioned by
# `ctmdeploy deploy --env prod --phase network` (bicep/network.bicep:
# resource groups, VNets, subnets, one NSG per subnet, spoke <-> utility
# peering — DR VNets included, in the DR region). Default stays bring-your-own
# (create: false); the vnets list below is the complete PoC address plan, so
# flipping the one flag provisions it. Address spaces are non-overlapping
# across all platforms AND between primary and DR (required for DR/failback
# peering).
network_infrastructure:
  create: false            # true = ctmdeploy provisions the full network below
  user_access_cidrs: []    # CIDRs allowed to reach Control-M Web/API (NSG rule)
  bastion_cidrs: []        # CIDRs allowed SSH 22 to nodes
  vnets:                   # every VNet referenced by the placement blocks above
    - name: vnet-prod-utility
      resource_group_name: rg-network-prod
      location: eastus2
      role: utility        # utility | spoke
      address_space: 10.70.0.0/22
      subnets:
        - {name: snet-ctm-em,       prefix: 10.70.0.0/24,  role: em}
        - {name: snet-ctm-postgres, prefix: 10.70.1.0/27,  role: data}
        - {name: snet-ctm-pe,       prefix: 10.70.1.64/26, role: pe}
    - name: vnet-ctm-uat
      resource_group_name: rg-network-prod
      location: eastus2
      role: spoke
      peer_to: vnet-prod-utility
      address_space: 10.70.8.0/24
      subnets:
        - {name: snet-ctm-server, prefix: 10.70.8.0/26,  role: server}
        - {name: snet-ctm-agents, prefix: 10.70.8.64/26, role: agents}
    - name: vnet-ctm-prod
      resource_group_name: rg-network-prod
      location: eastus2
      role: spoke
      peer_to: vnet-prod-utility
      address_space: 10.70.9.0/24
      subnets:
        - {name: snet-ctm-server, prefix: 10.70.9.0/26,  role: server}
        - {name: snet-ctm-agents, prefix: 10.70.9.64/26, role: agents}
    - name: vnet-dr-utility
      resource_group_name: rg-network-prod-dr
      location: centralus
      role: utility
      address_space: 10.80.0.0/22
      subnets:
        - {name: snet-ctm-em,       prefix: 10.80.0.0/24,  role: em}
        - {name: snet-ctm-postgres, prefix: 10.80.1.0/27,  role: data}
        - {name: snet-ctm-pe,       prefix: 10.80.1.64/26, role: pe}
    - name: vnet-ctm-prod-dr
      resource_group_name: rg-network-prod-dr
      location: centralus
      role: spoke
      peer_to: vnet-dr-utility
      address_space: 10.80.9.0/24
      subnets:
        - {name: snet-ctm-server, prefix: 10.80.9.0/26,  role: server}
        - {name: snet-ctm-agents, prefix: 10.80.9.64/26, role: agents}

deployer_ip_cidrs:
  - "203.0.113.10/32"

key_vault_public_access: true

ctm_version: "9.0.21.300"

# Blob-name overrides for installers / silent XMLs; {} keeps the defaults
# (same blob names as before the toolchain migration).
installer_blobs: {}

# Compute Gallery golden image published by Packer (packer/ctm-rhel9.pkr.hcl).
# All VMs and scale sets boot from this image instead of the marketplace image.
image:
  gallery_resource_group: ctm-images-rg
  gallery_name: ctmgallery
  image_definition: ctm-rhel9
  image_version: latest # or an explicit version such as "1.0.0"

em:
  vm_size: Standard_D16s_v5
  data_disk_gb: 1024
  disk_type: Premium_ZRS
  enable_secondary: true
  zones: ["1", "2"]
  web_port: 8443

servers:
  uat:
    name: CTM_UAT
    vm_size: Standard_D8s_v5
    data_disk_gb: 512
    disk_type: Premium_ZRS
    enable_secondary: true
    zones: ["1", "2"]
    network: # REQUIRED: this server's own VNet (isolated from the other servers)
      vnet_name: vnet-ctm-uat
      vnet_resource_group_name: rg-network-prod
      server_subnet_name: snet-ctm-server
      agents_subnet_name: snet-ctm-agents # optional; default = server_subnet_name
      # Agents may be relocated to another VNet entirely (optional overrides):
      # agents_vnet_name: null
      # agents_vnet_resource_group_name: null
    agents:
      vm_size: Standard_D4s_v5
      min: 2
      max: 6
      default: 2
      use_spot: false
      scale_out_cpu: 70
      scale_in_cpu: 25
  prod:
    name: CTM_PROD
    vm_size: Standard_D16s_v5
    data_disk_gb: 1024
    disk_type: Premium_ZRS
    enable_secondary: true
    zones: ["1", "2"]
    network:
      vnet_name: vnet-ctm-prod
      vnet_resource_group_name: rg-network-prod
      server_subnet_name: snet-ctm-server
      agents_subnet_name: snet-ctm-agents
    agents:
      vm_size: Standard_D4s_v5
      min: 3
      max: 20
      default: 3
      use_spot: false
      scale_out_cpu: 65
      scale_in_cpu: 20

database:
  sku_name: GP_Standard_D8ds_v5
  storage_mb: 524288
  high_availability_mode: ZoneRedundant
  backup_retention_days: 35
  geo_redundant_backup: true
  postgres_version: "16"

storage:
  blob_replication_type: RAGZRS
  files_replication_type: ZRS
  shared_share_quota_gb: 512

load_balancer:
  internal: true

backup:
  enabled: true
  storage_mode_type: GeoRedundant
  cross_region_restore: true
  daily_retention_days: 35
  weekly_retention_weeks: 52
  include_files_share: true

observability:
  log_retention_days: 90
  alert_emails:
    - ctm-prod-alerts@example.com
    - noc@example.com

dr:
  enabled: true
  location: centralus
  network:
    utility: # DR EM failover target, DB replica subnet, PEs, DR LB frontend
      vnet_name: vnet-dr-utility
      vnet_resource_group_name: rg-network-prod-dr
      em_subnet_name: snet-ctm-em
      data_subnet_name: snet-ctm-postgres
      pe_subnet_name: snet-ctm-pe
    existing_private_dns_zone_ids: {}
    extra_dns_vnets: []
  # DR OPT-IN SET: a server is DR-protected if and only if it has an entry
  # here (ASR failover target + warm agents, same shape as servers.*.network).
  # CTM_UAT is intentionally absent: it is re-deployable and not
  # business-critical — no uat DR VNet, no uat ASR items, no uat warm pool.
  # Note: the shared PG replica still carries EVERY database on the server
  # (ctm_uat included) because replication is server-level, so UAT *data*
  # survives even though UAT compute is not replicated.
  server_networks:
    prod:
      vnet_name: vnet-ctm-prod-dr
      vnet_resource_group_name: rg-network-prod-dr
      server_subnet_name: snet-ctm-server
      agents_subnet_name: snet-ctm-agents
  warm_agents: 1 # per DR-protected Server (prod only) in the DR region
  replica_sku_name: GP_Standard_D8ds_v5
  enable_site_recovery: true
  traffic_manager: false

# Installer media source of truth: the BMC EPD archives + silent-install XMLs
# live as Universal Packages in an Azure Artifacts feed. The pipeline (or
# `ctmdeploy media upload`) moves them into the installers blob containers of
# BOTH the primary and the DR platform; nodes still download from blob via
# managed identity at first boot. Replace the REPLACE_WITH_* placeholders with
# your Azure DevOps organization/project.
media:
  azure_artifacts:
    organization: "https://dev.azure.com/REPLACE_WITH_ORG"
    project: "REPLACE_WITH_PROJECT"
    feed: ctm-media
    packages:                 # universal packages holding the BMC EPD files + silent XMLs
      em:         {name: control-m-em,         version: "9.0.21.300"}
      server:     {name: control-m-server,     version: "9.0.21.300"}
      silent_xml: {name: control-m-silent-xml, version: "1.0.0"}
