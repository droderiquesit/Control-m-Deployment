# terraform init + plan|apply for one environment, authenticated to Azure through
# the Workload Identity Federation service connection (azurerm provider native
# ADO OIDC support: tokens are minted on demand, so long applies never expire).
parameters:
  - name: environment
    type: string
  - name: command
    type: string
    values: [plan, apply]
  - name: planArtifact
    type: string
    default: ""

steps:
  - template: steps-terraform-install.yml
    parameters:
      version: $(terraformVersion)

  - task: AzureCLI@2
    displayName: Resolve Azure identity (${{ parameters.environment }})
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
        echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
        echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"

  - bash: |
      set -euo pipefail
      terraform init -input=false -backend-config=backend.hcl
    displayName: terraform init
    workingDirectory: environments/${{ parameters.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
      ARM_OIDC_REQUEST_URL: $(System.OidcRequestUri)
      ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: $(azureServiceConnectionId)

  - ${{ if eq(parameters.command, 'plan') }}:
      - bash: |
          set -euo pipefail
          rc=0
          terraform plan -input=false -no-color -detailed-exitcode \
            -var "subscription_id=$ARM_SUBSCRIPTION_ID" \
            -out "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan" \
            | tee "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}-plan.txt" || rc=$?
          case $rc in
            0) echo "##vso[task.setvariable variable=planHasChanges;isOutput=true]false" ;;
            2) echo "##vso[task.setvariable variable=planHasChanges;isOutput=true]true" ;;
            *) exit $rc ;;
          esac
          terraform show -json "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan" \
            > "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}-plan.json"
          cp .terraform.lock.hcl "$(Build.ArtifactStagingDirectory)/"
        displayName: terraform plan
        name: plan
        workingDirectory: environments/${{ parameters.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
          ARM_OIDC_REQUEST_URL: $(System.OidcRequestUri)
          ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: $(azureServiceConnectionId)
          TF_VAR_platform_secrets: $(platformSecretsJson)

      - publish: $(Build.ArtifactStagingDirectory)
        artifact: ${{ parameters.planArtifact }}
        displayName: Publish plan artifact

  - ${{ if eq(parameters.command, 'apply') }}:
      - download: current
        artifact: ${{ parameters.planArtifact }}
        displayName: Download plan artifact

      - bash: |
          set -euo pipefail
          cp "$(Pipeline.Workspace)/${{ parameters.planArtifact }}/.terraform.lock.hcl" .
          terraform init -input=false -backend-config=backend.hcl -reconfigure >/dev/null
          # The saved plan is bound to the state serial it was produced from:
          # Terraform refuses to apply it if the state changed since the plan stage.
          terraform apply -input=false -no-color "$(Pipeline.Workspace)/${{ parameters.planArtifact }}/${{ parameters.environment }}.tfplan"
          terraform output -json > "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}-outputs.json"
        displayName: terraform apply (saved plan)
        workingDirectory: environments/${{ parameters.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
          ARM_OIDC_REQUEST_URL: $(System.OidcRequestUri)
          ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: $(azureServiceConnectionId)
          TF_VAR_platform_secrets: $(platformSecretsJson)

      - publish: $(Build.ArtifactStagingDirectory)
        artifact: outputs-${{ parameters.environment }}-$(Build.BuildId)
        displayName: Publish outputs
