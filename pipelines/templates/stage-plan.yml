parameters:
  - name: environment
    type: string

stages:
  - stage: plan_${{ parameters.environment }}
    displayName: Plan ${{ parameters.environment }}
    dependsOn: [validate, security]
    # Plan when validation passed and the security stage passed or was switched off (never when it failed).
    condition: >-
      and(
        eq(dependencies.validate.result, 'Succeeded'),
        in(dependencies.security.result, 'Succeeded', 'Skipped')
      )
    jobs:
      - job: plan
        displayName: terraform plan (${{ parameters.environment }})
        steps:
          - checkout: self
            fetchDepth: 1

          - template: steps-dsv-secrets.yml
            parameters:
              environment: ${{ parameters.environment }}
              readPlatform: true

          - template: steps-terraform-run.yml
            parameters:
              environment: ${{ parameters.environment }}
              command: plan
              planArtifact: tfplan-${{ parameters.environment }}
