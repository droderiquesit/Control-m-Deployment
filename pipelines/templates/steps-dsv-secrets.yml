# Reads platform secrets from Delinea DevOps Secrets Vault and exposes them as
# secret pipeline variables:
#   platformSecretsJson  -> passed to ctmdeploy as CTM_PLATFORM_SECRETS (JSON map
#                           of overrides; ctmdeploy seeds them into Key Vault)
#   checkmarxClientId / checkmarxClientSecret (optional, when readCheckmarx=true)
#
# DSV layout (create with `dsv secret create --path ... --data '{...}'`):
#   <prefix>/<platform>/platform  { "db-admin-password", "em-db-password", "em-admin-password",
#                                   "ctm-db-password-<server key>" (dev/qa or uat/prod),
#                                   "ssh-private-key" (optional) }
#   <prefix>/shared/checkmarx  { "client-id", "client-secret" }
#
# Authentication: client credentials from the ctm-dsv-auth variable group
# (DSV_TENANT, DSV_CLIENT_ID, DSV_CLIENT_SECRET) or, on a self-hosted agent
# with a managed identity, dsvAuthType=azure (no secret at all).
parameters:
  - name: environment
    type: string
    default: ""
  - name: readPlatform
    type: boolean
    default: true
  - name: readCheckmarx
    type: boolean
    default: false

steps:
  - bash: |
      set -euo pipefail
      V="$(dsvCliVersion)"
      curl -fsSL -o "$(Agent.TempDirectory)/dsv" "https://dsv.secretsvaultcloud.com/downloads/cli/${V}/dsv-linux-x64"
      sudo install -m 0755 "$(Agent.TempDirectory)/dsv" /usr/local/bin/dsv
      dsv --version
    displayName: Install Delinea DSV CLI

  - bash: |
      set -euo pipefail
      export DSV_TENANT="$(DSV_TENANT)"
      export DSV_DOMAIN="$(dsvDomain)"
      export DSV_AUTH_TYPE="$(dsvAuthType)"
      if [ "$DSV_AUTH_TYPE" = "clientcred" ]; then
        export DSV_AUTH_CLIENT_ID="$(DSV_CLIENT_ID)"
        export DSV_AUTH_CLIENT_SECRET="$DSV_CLIENT_SECRET"
      fi

      read_secret() { dsv secret read --path "$1" --out json | jq -c '.data'; }

      if [ "${{ parameters.readPlatform }}" = "True" ]; then
        P="$(dsvSecretPathPrefix)/${{ parameters.environment }}/platform"
        DATA=$(read_secret "$P")
        # keep only the secret names ctmdeploy understands (same allowlist as the vault layout)
        JSON=$(echo "$DATA" | jq -c 'with_entries(select(.key | (IN("db-admin-password","em-db-password","em-admin-password","ssh-private-key") or startswith("ctm-db-password-"))))')
        echo "##vso[task.setvariable variable=platformSecretsJson;issecret=true]$JSON"
        echo "read $(echo "$JSON" | jq 'keys | length') platform secret(s) from $P"
      fi

      if [ "${{ parameters.readCheckmarx }}" = "True" ]; then
        P="$(dsvSecretPathPrefix)/shared/checkmarx"
        DATA=$(read_secret "$P")
        echo "##vso[task.setvariable variable=checkmarxClientId;issecret=true]$(echo "$DATA" | jq -r '."client-id"')"
        echo "##vso[task.setvariable variable=checkmarxClientSecret;issecret=true]$(echo "$DATA" | jq -r '."client-secret"')"
        echo "read Checkmarx credentials from $P"
      fi
    displayName: Read secrets from Delinea DSV
    env:
      DSV_CLIENT_SECRET: $(DSV_CLIENT_SECRET)
