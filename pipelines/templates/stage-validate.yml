# Static validation: compile + lint every Bicep file (bicep/, network/,
# identity/), build the network bicepparam files, byte-compile and test the
# ctmdeploy package plus the stdlib-only node installer and the kvsync
# function source, syntax-check the cloud-init shims and Packer provisioning
# scripts, and load both environment configs.
parameters:
  - name: environments
    type: object
  # '' = Microsoft-hosted ubuntu-latest; a name = the self-hosted Azure DevOps
  # scale-set pool (ctm-build-agents VMSS). Set via agentPoolName in
  # pipelines/variables/common.yml.
  - name: agentPool
    type: string
    default: ""

stages:
  - stage: validate
    displayName: Validate
    jobs:
      - job: static_checks
        displayName: bicep build+lint / pytest / shell syntax
        pool:
          ${{ if eq(parameters.agentPool, '') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.agentPool }}
        steps:
          - checkout: self
            fetchDepth: 1

          - template: steps-tools-install.yml
            parameters:
              includeDev: true

          - bash: |
              set -euo pipefail
              rc=0
              while IFS= read -r f; do
                echo "== bicep build+lint: $f"
                bicep build "$f" --stdout >/dev/null || rc=1
                bicep lint "$f" || rc=1
              done < <(find bicep network identity -name '*.bicep' | sort)
              # The cloud team's parameter files must stay deployable as-is.
              for p in network/params/*.bicepparam; do
                [ -e "$p" ] || continue
                echo "== bicep build-params: $p"
                bicep build-params "$p" --stdout >/dev/null || rc=1
              done
              exit $rc
            displayName: bicep build + lint (bicep/, network/, identity/)

          - bash: |
              set -euo pipefail
              # deploy = the orchestrator; node-scripts = the stdlib-only node
              # installer; functions = the kvsync source (compile only — its
              # azure deps are runtime-only and never imported here).
              python -m compileall -q deploy node-scripts functions
            displayName: python compileall

          - bash: |
              set -euo pipefail
              python -m pytest deploy/tests -q
            displayName: pytest (config / node plan / render)

          - ${{ each env in parameters.environments }}:
              - bash: |
                  set -euo pipefail
                  python -c "from pathlib import Path; from ctmdeploy.config import load_config; cfg = load_config('${{ env.name }}', Path('.'), allow_placeholders=True); print('config ok:', cfg.name, '-', len(cfg.servers), 'server(s)')"
                displayName: config load (${{ env.name }})

          # Packer provisioning scripts and cloud-init templates are plain bash
          # (the __TOKEN__ placeholders are legal strings), so `bash -n` parses
          # them. `packer validate` itself is intentionally NOT run here:
          # Packer is only installed in the image stage, and template validation
          # needs the azure plugin + credentials. The image stage validates
          # implicitly on build.
          - bash: |
              set -euo pipefail
              for f in cloud-init/*.tmpl packer/scripts/*.sh; do
                bash -n "$f" || exit 1
              done
              echo "cloud-init templates and packer scripts parse"
            displayName: shell syntax check
