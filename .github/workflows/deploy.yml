# Control-M platform — GitHub Actions mirror of the Azure DevOps pipeline:
# lint (bicep build/lint + pytest) -> whatif with a PR comment -> gated apply
# (nonprod on push to main, prod via workflow_dispatch + GitHub environment).
# NOTE: no Delinea DSV wiring here — ctmdeploy generates any secret that is
# absent from Key Vault; optionally supply overrides via the repository secret
# CTM_PLATFORM_SECRETS (JSON map, same keys as the DSV platform secret).
name: deploy

on:
  pull_request:
    paths:
      - "bicep/**"
      - "deploy/**"
      - "environments/**"
      - "cloud-init/**"
      - "packer/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "bicep/**"
      - "deploy/**"
      - "environments/**"
      - "cloud-init/**"
      - "packer/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [nonprod, prod]
        required: true

permissions:
  id-token: write # Azure OIDC federated login (no stored secrets)
  contents: read
  pull-requests: write

env:
  # Pin + checksum of the bicep-linux-x64 release asset (Azure/bicep releases).
  BICEP_VERSION: "0.30.23"
  BICEP_SHA256: "b6a41ce8bdbf448feaf8fe2286164fb8c84e5d006c293fbc20591ff9baf76f18"
  PYTHON_VERSION: "3.12"
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  lint:
    name: bicep build+lint / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install bicep (pinned, sha256 verified)
        run: |
          curl -fsSL -o /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  /tmp/bicep" | sha256sum -c -
          sudo install -m 0755 /tmp/bicep /usr/local/bin/bicep
          bicep --version
      - name: install ctmdeploy
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "deploy/[dev]"
      - name: bicep build + lint (all templates)
        run: |
          rc=0
          while IFS= read -r f; do
            echo "== $f"
            bicep build "$f" --stdout >/dev/null || rc=1
            bicep lint "$f" || rc=1
          done < <(find bicep -name '*.bicep' | sort)
          exit $rc
      - run: python -m compileall -q deploy
      - run: python -m pytest deploy/tests -q
      - name: shell syntax check (cloud-init + packer scripts)
        run: |
          for f in cloud-init/*.tmpl packer/scripts/*.sh; do bash -n "$f"; done

  whatif:
    name: whatif (${{ matrix.env }})
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [nonprod, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install bicep (pinned, sha256 verified)
        run: |
          curl -fsSL -o /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  /tmp/bicep" | sha256sum -c -
          sudo install -m 0755 /tmp/bicep /usr/local/bin/bicep
      - name: install ctmdeploy
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e deploy/
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ctmdeploy whatif
        env:
          CTM_PLATFORM_SECRETS: ${{ secrets.CTM_PLATFORM_SECRETS }}
        run: |
          set -o pipefail
          python -m ctmdeploy whatif --env ${{ matrix.env }} \
            --output whatif.json | tee whatif.txt
      - name: comment what-if on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('whatif.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `### ctmdeploy whatif: ${{ matrix.env }}\n\`\`\`\n${body}\n\`\`\``
            });
      - uses: actions/upload-artifact@v4
        with:
          name: whatif-${{ matrix.env }}
          path: |
            whatif.txt
            whatif.json

  apply:
    name: apply (${{ github.event.inputs.environment || 'nonprod' }})
    needs: lint
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # GitHub "environments" carry required reviewers for prod.
    environment: ${{ github.event.inputs.environment || 'nonprod' }}
    concurrency: ctm-${{ github.event.inputs.environment || 'nonprod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install bicep (pinned, sha256 verified)
        run: |
          curl -fsSL -o /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  /tmp/bicep" | sha256sum -c -
          sudo install -m 0755 /tmp/bicep /usr/local/bin/bicep
      - name: install ctmdeploy
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e deploy/
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ctmdeploy deploy --phase all
        env:
          CTM_PLATFORM_SECRETS: ${{ secrets.CTM_PLATFORM_SECRETS }}
          CTM_DEPLOYER_OBJECT_ID: ${{ secrets.AZURE_DEPLOYER_OBJECT_ID }}
        run: |
          python -m ctmdeploy deploy \
            --env ${{ github.event.inputs.environment || 'nonprod' }} \
            --phase all --yes --wait
