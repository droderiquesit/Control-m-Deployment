name: terraform

on:
  pull_request:
    paths: ["modules/**", "environments/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["modules/**", "environments/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [nonprod, prod]
        required: true

permissions:
  id-token: write # Azure OIDC federated login (no stored secrets)
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  lint:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: validate every environment
        run: |
          for e in nonprod prod; do
            terraform -chdir=environments/$e init -backend=false -input=false >/dev/null
            terraform -chdir=environments/$e validate -no-color
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive --config "$(pwd)/.tflint.hcl"

  plan:
    name: plan (${{ matrix.env }})
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [nonprod, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir=environments/${{ matrix.env }} init -input=false -backend-config=backend.hcl
      - run: terraform -chdir=environments/${{ matrix.env }} plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `### terraform plan: ${{ matrix.env }}\n\`\`\`\n${body}\n\`\`\``
            });

  apply:
    name: apply (${{ github.event.inputs.environment || 'nonprod' }})
    needs: lint
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # GitHub "environments" carry required reviewers for prod.
    environment: ${{ github.event.inputs.environment || 'nonprod' }}
    concurrency: terraform-${{ github.event.inputs.environment || 'nonprod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir=environments/${{ github.event.inputs.environment || 'nonprod' }} init -input=false -backend-config=backend.hcl
      - run: terraform -chdir=environments/${{ github.event.inputs.environment || 'nonprod' }} apply -input=false -auto-approve
